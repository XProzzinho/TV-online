name: Atualizar minha lista M3U

# Monta listas/minha.m3u de novo a cada 6 horas (os links da Pluto TV mudam)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar a lista
        run: python3 listas/gerar.py
      - name: Salvar
        run: |
          git config user.name "Lumi TV"
          git config user.email "geansdp2@gmail.com"
          git add listas/minha.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Lista M3U atualizada"
          git push
